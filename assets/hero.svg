<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1B1F"/>
      <stop offset="50%" style="stop-color:#2B2930"/>
      <stop offset="100%" style="stop-color:#1C1B1F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6750A4"/>
      <stop offset="100%" style="stop-color:#7F67BE"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#6750A4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6750A4;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Decorative grid dots -->
  <g opacity="0.08">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#E6E1E5"/>
    </pattern>
    <rect width="1280" height="640" fill="url(#dots)"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="320" cy="320" r="280" fill="url(#glowGrad)"/>
  <circle cx="960" cy="320" r="280" fill="url(#glowGrad)"/>

  <!-- Decorative circles -->
  <circle cx="180" cy="120" r="60" fill="none" stroke="#6750A4" stroke-width="0.5" opacity="0.3"/>
  <circle cx="180" cy="120" r="90" fill="none" stroke="#6750A4" stroke-width="0.5" opacity="0.2"/>
  <circle cx="1100" cy="520" r="50" fill="none" stroke="#7F67BE" stroke-width="0.5" opacity="0.3"/>
  <circle cx="1100" cy="520" r="80" fill="none" stroke="#7F67BE" stroke-width="0.5" opacity="0.2"/>

  <!-- Left section: Icon -->
  <g transform="translate(320, 320)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="0.5" opacity="0.3"/>

    <!-- AI Agent Icon - abstract robot/agent head -->
    <!-- Head base -->
    <rect x="-45" y="-55" width="90" height="75" rx="20" fill="#6750A4" opacity="0.9"/>
    <!-- Eyes -->
    <circle cx="-16" cy="-25" r="7" fill="#FFFFFF"/>
    <circle cx="16" cy="-25" r="7" fill="#FFFFFF"/>
    <!-- Eye pupils -->
    <circle cx="-14" cy="-23" r="3" fill="#6750A4"/>
    <circle cx="18" cy="-23" r="3" fill="#6750A4"/>
    <!-- Mouth / grill -->
    <rect x="-18" y="-6" width="36" height="4" rx="2" fill="#FFFFFF" opacity="0.8"/>
    <rect x="-18" y="2" width="36" height="4" rx="2" fill="#FFFFFF" opacity="0.6"/>
    <rect x="-18" y="10" width="36" height="4" rx="2" fill="#FFFFFF" opacity="0.4"/>

    <!-- Antenna -->
    <line x1="0" y1="-55" x2="0" y2="-80" stroke="#7F67BE" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-85" r="6" fill="#4CAF50" filter="url(#glow)"/>

    <!-- Body suggestion -->
    <path d="M-35,20 L-40,70 L40,70 L35,20" fill="none" stroke="#6750A4" stroke-width="2" opacity="0.5"/>

    <!-- Action dots orbiting -->
    <circle cx="90" cy="-60" r="4" fill="#4CAF50" opacity="0.7"/>
    <circle cx="105" cy="-30" r="3" fill="#7F67BE" opacity="0.6"/>
    <circle cx="95" cy="5" r="3.5" fill="#A5D6A7" opacity="0.5"/>
    <circle cx="-95" cy="-40" r="3" fill="#4CAF50" opacity="0.5"/>
    <circle cx="-100" cy="-10" r="2.5" fill="#7F67BE" opacity="0.4"/>
  </g>

  <!-- Right section: Text -->
  <g transform="translate(680, 250)">
    <!-- Agentra -->
    <text x="0" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="2">
      Agentra
    </text>

    <!-- Underline accent -->
    <rect x="0" y="18" width="180" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Tagline -->
    <text x="0" y="70" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="300" fill="#CAC4D0" letter-spacing="1">
      AI-Powered Android Automation Agent
    </text>

    <!-- Description -->
    <text x="0" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#938F99" letter-spacing="0.5">
      <tspan x="0" dy="0">Intelligent mobile automation powered by Large Language Models.</tspan>
      <tspan x="0" dy="26">Perceive the screen. Plan actions. Execute like a human.</tspan>
    </text>

    <!-- Badge row -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="95" height="30" rx="6" fill="#6750A4" opacity="0.8"/>
      <text x="47" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Kotlin</text>

      <rect x="105" y="0" width="110" height="30" rx="6" fill="#2B2930" stroke="#6750A4" stroke-width="1"/>
      <text x="160" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#E6E1E5" text-anchor="middle">Min SDK 26</text>

      <rect x="225" y="0" width="120" height="30" rx="6" fill="#2B2930" stroke="#4CAF50" stroke-width="1"/>
      <text x="285" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#4CAF50" text-anchor="middle">68/68 Tests ✅</text>
    </g>
  </g>

  <!-- Bottom tagline bar -->
  <rect x="0" y="620" width="1280" height="20" fill="#6750A4" opacity="0.15"/>
  <text x="640" y="634" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#938F99" text-anchor="middle" letter-spacing="3">NATURAL LANGUAGE • SCREEN PERCEPTION • AUTONOMOUS EXECUTION</text>
</svg>
